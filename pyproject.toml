[project]
name = "hybridforgelab-shipshape-mcp"
version = "0.1.0"
description = "Dockerfile and Kubernetes lint for coding agents: Pod Security Standards, A–F grade, a fix per finding. Bring your own RapidAPI or api.market key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Hybrid Forge Lab", email = "hybridforgelab@gmail.com" }]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.urls]
Homepage = "https://shipshape.hybridforgelab.com"

[project.scripts]
shipshape-mcp = "shipshape_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipshape_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=shipshape_mcp --cov-report=term-missing:skip-covered --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
